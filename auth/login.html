<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - CodeMaster Academy</title>
    <meta name="description" content="Masuk ke akun CodeMaster Academy Anda untuk melanjutkan pembelajaran.">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6C3CE1;
            --primary-dark: #5A2BC4;
            --primary-light: #8B5CF6;
            --secondary: #06D6A0;
            --secondary-dark: #05B88A;
            --dark: #0F0F1A;
            --dark-2: #1A1A2E;
            --dark-3: #252540;
            --gray-1: #6B7280;
            --gray-2: #9CA3AF;
            --gray-3: #D1D5DB;
            --white: #FFFFFF;
            --gradient-1: linear-gradient(135deg, #6C3CE1 0%, #06D6A0 100%);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.2);
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: var(--dark-2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--white);
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 16px;
        }

        .auth-logo .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--gray-2);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--gray-2);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--dark-3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.2);
        }

        .form-group input::placeholder {
            color: var(--gray-1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-2);
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .forgot-link {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(108, 60, 225, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 60, 225, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .auth-divider {
            text-align: center;
            margin: 24px 0;
            color: var(--gray-1);
            position: relative;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-divider span {
            background: var(--dark-2);
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--dark-3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-light);
        }

        .auth-footer {
            text-align: center;
            margin-top: 32px;
            color: var(--gray-2);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #FF6B6B;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }

        .form-group.error input {
            border-color: #FF6B6B;
        }

        .form-group.error .error-msg {
            display: block;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 24px;
            }

            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <a href="../index.html" class="auth-logo">
                <div class="logo-icon">⚡</div> CodeMaster
            </a>
            <h1>Selamat Datang Kembali 👋</h1>
            <p>Masuk untuk melanjutkan perjalanan coding Anda</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group" id="emailGroup">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                <span class="error-msg">Mohon masukkan email yang valid</span>
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                <span class="error-msg">Password minimal 6 karakter</span>
            </div>

            <div class="form-options">
                <label class="checkbox-group">
                    <input type="checkbox" name="remember"> Ingat saya
                </label>
                <a href="#" class="forgot-link">Lupa password?</a>
            </div>

            <button type="submit" class="btn btn-primary">🔐 Masuk ke Akun</button>
        </form>

        <div class="auth-divider"><span>atau masuk dengan</span></div>

        <div class="social-login">
            <a href="#" class="social-btn" onclick="socialLogin('google')">
                <span>🔵</span> Google
            </a>
            <a href="#" class="social-btn" onclick="socialLogin('github')">
                <span>⚫</span> GitHub
            </a>
        </div>

        <div class="auth-footer">
            Belum punya akun? <a href="register.html">Daftar gratis</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            let valid = true;

            // Simple validation
            if (!email.includes('@')) {
                document.getElementById('emailGroup').classList.add('error');
                valid = false;
            } else {
                document.getElementById('emailGroup').classList.remove('error');
            }

            if (password.length < 6) {
                document.getElementById('passwordGroup').classList.add('error');
                valid = false;
            } else {
                document.getElementById('passwordGroup').classList.remove('error');
            }

            if (valid) {
                // Simulate login - redirect to dashboard
                alert('Login berhasil! Mengalihkan ke dashboard...');
                window.location.href = '../index.html';
            }
        }

        function socialLogin(provider) {
            alert(`Menghubungkan dengan ${provider}... (Demo)`);
            // Implement OAuth flow here
        }

        // Clear error on input
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function () {
                this.closest('.form-group')?.classList.remove('error');
            });
        });
    </script>
</body>

</html>
